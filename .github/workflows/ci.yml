# CI for Commons Check: typecheck, lint, format, build, tests with coverage, license audit and package dry-run on
# Node 22/24/26, plus the Action on this repository, once after `npm ci` and once from a clean install.
# Read-only token; actions pinned by commit SHA.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:all
      - run: node scripts/license-audit.mjs --all
      - run: npm pack --dry-run

  # Runs the action the way a consumer gets it (dist/ built, node_modules removed), on this repository.
  action-clean-install:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts && npm run build && rm -rf node_modules
      - id: commons
        uses: ./
        with:
          base: origin/${{ github.base_ref }}
          out-dir: commons-report
          fail-on-error: "true"
      - name: Check the installed dependencies and the outputs
        env:
          OUT_DIR: ${{ steps.commons.outputs.out-dir }}
          ERRORS: ${{ steps.commons.outputs.errors }}
          VERDICT: ${{ steps.commons.outputs.verdict }}
        run: |
          test -f node_modules/@enwithai/product-check/package.json
          test ! -e node_modules/typescript-eslint
          test ! -e node_modules/vitest
          test "$ERRORS" = 0
          test -n "$VERDICT"
          for f in SUMMARY.md commons-summary.json spec-check.json impact-check.json graph.json product-check/product-check-results.json; do test -s "$OUT_DIR/$f"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commons-report
          path: commons-report/
          retention-days: 7
